<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 HCBS Booth Map</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: #006273;
            padding: 20px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .header {
            background: #006273;
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 10px 10px 0 0;
        }

        .header h1 {
            font-size: 24px;
        }

        .btn {
            background: white;
            color: #006273;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-left: 10px;
            font-weight: bold;
        }

        .btn:hover {
            background: #f0f0f0;
        }

        .legend {
            padding: 15px 30px;
            background: #f5f5f5;
            display: flex;
            gap: 20px;
            align-items: center;
            border-bottom: 1px solid #ddd;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .legend-box {
            width: 25px;
            height: 18px;
            border: 1px solid #333;
        }

        .stats {
            padding: 20px 30px;
            display: flex;
            gap: 40px;
            justify-content: center;
            border-bottom: 1px solid #ddd;
        }

        .stat {
            text-align: center;
        }

        .stat-number {
            font-size: 32px;
            font-weight: bold;
            color: #006273;
        }

        .stat-label {
            font-size: 14px;
            color: #666;
        }

        .map-wrapper {
            padding: 30px;
            background: #f9f9f9;
        }

        .floor-plan {
            display: flex;
            justify-content: space-between;
            max-width: 1400px;
            margin: 0 auto;
            gap: 15px;
        }

        .column {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .center-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 0 20px;
        }

        .booth {
            background: #28a745;
            border: 2px solid #000;
            padding: 12px 8px;
            text-align: center;
            font-weight: bold;
            color: white;
            cursor: pointer;
            border-radius: 3px;
            font-size: 12px;
            min-width: 60px;
            transition: all 0.2s;
        }

        .booth:hover {
            transform: scale(1.08);
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            z-index: 100;
        }

        .booth.pending {
            background: #ffc107;
            color: #000;
        }

        .booth.taken {
            background: #dc3545;
        }

        .special {
            background: #e9ecef;
            border: 2px dashed #666;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #666;
            font-size: 16px;
            border-radius: 5px;
        }

        .stage {
            height: 200px;
        }

        .dance {
            height: 280px;
        }

        .food {
            flex: 1;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 10px;
            max-width: 500px;
            width: 90%;
        }

        .modal-header {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #006273;
        }

        .field {
            margin-bottom: 15px;
        }

        .field label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }

        .field input, .field select, .field textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }

        .field textarea {
            min-height: 80px;
            resize: vertical;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .modal-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .modal-btn.save {
            background: #006273;
            color: white;
        }

        .modal-btn.clear {
            background: #dc3545;
            color: white;
        }

        .modal-btn.cancel {
            background: #ddd;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>2026 HCBS Booth Map - 70 Spaces</h1>
            <div>
                <button class="btn" onclick="exportData()">Export CSV</button>
                <button class="btn" onclick="resetAll()">Reset All</button>
            </div>
        </div>

        <div class="legend">
            <strong>Legend:</strong>
            <div class="legend-item">
                <div class="legend-box" style="background:#28a745"></div>
                <span>Available</span>
            </div>
            <div class="legend-item">
                <div class="legend-box" style="background:#ffc107"></div>
                <span>Pending</span>
            </div>
            <div class="legend-item">
                <div class="legend-box" style="background:#dc3545"></div>
                <span>Taken</span>
            </div>
        </div>

        <div class="stats">
            <div class="stat">
                <div class="stat-number" id="total">70</div>
                <div class="stat-label">Total</div>
            </div>
            <div class="stat">
                <div class="stat-number" id="available">70</div>
                <div class="stat-label">Available</div>
            </div>
            <div class="stat">
                <div class="stat-number" id="pending">0</div>
                <div class="stat-label">Pending</div>
            </div>
            <div class="stat">
                <div class="stat-number" id="taken">0</div>
                <div class="stat-label">Taken</div>
            </div>
        </div>

        <div class="map-wrapper">
            <div class="floor-plan">
                <!-- Left Side -->
                <div class="column" id="col1"></div>
                <div class="column" id="col2"></div>
                <div class="column" id="col3"></div>
                <div class="column" id="col4"></div>
                <div class="column" id="col5"></div>

                <!-- Center -->
                <div class="center-area">
                    <div class="special stage">STAGE<br>16×12</div>
                    <div class="special dance">Dance Floor<br>16×20</div>
                    <div class="special food">FOOD</div>
                </div>

                <!-- Right Side -->
                <div class="column" id="col6"></div>
                <div class="column" id="col7"></div>
                <div class="column" id="col8"></div>
                <div class="column" id="col9"></div>
                <div class="column" id="col10"></div>
            </div>
        </div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-header">Booth <span id="boothNum"></span></div>
            <div class="field">
                <label>Status</label>
                <select id="status">
                    <option value="available">Available</option>
                    <option value="pending">Pending</option>
                    <option value="taken">Taken</option>
                </select>
            </div>
            <div class="field">
                <label>Organization</label>
                <input type="text" id="org" placeholder="Organization name">
            </div>
            <div class="field">
                <label>Contact</label>
                <input type="text" id="contact" placeholder="Contact person">
            </div>
            <div class="field">
                <label>Email</label>
                <input type="email" id="email" placeholder="Email address">
            </div>
            <div class="field">
                <label>Notes</label>
                <textarea id="notes" placeholder="Additional notes"></textarea>
            </div>
            <div class="modal-buttons">
                <button class="modal-btn cancel" onclick="closeModal()">Cancel</button>
                <button class="modal-btn clear" onclick="clearBooth()">Clear</button>
                <button class="modal-btn save" onclick="saveBooth()">Save</button>
            </div>
        </div>
    </div>

    <script>
        // Define all 70 booths organized by column
        const layout = {
            col1: ['100', '104', '106', '108', '110', '112', '114'],
            col2: ['101', '103', '105', '107', '109', '111', '113A', '113B', '115', '117'],
            col3: ['200', '204', '206', '208A', '208B', '212A', '212B', '214'],
            col4: ['201', '203', '207A', '207B', '211A', '211B', '213A', '213B', '215A', '215B'],
            col5: ['300', '304A', '304B', '308A', '308B', '312A', '312B'],
            col6: ['401', '403', '407A', '407B', '411A', '411B', '413A', '413B', '415A', '415B'],
            col7: ['500', '504A', '504B', '508A', '508B', '510A', '510B', '512', '514'],
            col8: ['501', '505A', '505B', '507', '509', '511', '513', '515'],
            col9: [], // Empty for now
            col10: [] // Empty for now
        };

        let boothData = {};
        let currentBooth = null;

        function init() {
            loadData();
            renderBooths();
            updateStats();
        }

        function renderBooths() {
            for (let colId in layout) {
                const col = document.getElementById(colId);
                col.innerHTML = '';
                layout[colId].forEach(boothId => {
                    const booth = document.createElement('div');
                    booth.className = 'booth';
                    booth.textContent = boothId;
                    const data = boothData[boothId] || { status: 'available' };
                    booth.classList.add(data.status);
                    booth.onclick = () => openModal(boothId);
                    col.appendChild(booth);
                });
            }
        }

        function openModal(boothId) {
            currentBooth = boothId;
            const data = boothData[boothId] || { status: 'available', organization: '', contact: '', email: '', notes: '' };
            document.getElementById('boothNum').textContent = boothId;
            document.getElementById('status').value = data.status;
            document.getElementById('org').value = data.organization || '';
            document.getElementById('contact').value = data.contact || '';
            document.getElementById('email').value = data.email || '';
            document.getElementById('notes').value = data.notes || '';
            document.getElementById('modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
            currentBooth = null;
        }

        function saveBooth() {
            boothData[currentBooth] = {
                status: document.getElementById('status').value,
                organization: document.getElementById('org').value,
                contact: document.getElementById('contact').value,
                email: document.getElementById('email').value,
                notes: document.getElementById('notes').value
            };
            saveData();
            renderBooths();
            updateStats();
            closeModal();
        }

        function clearBooth() {
            if (confirm(`Clear booth ${currentBooth}?`)) {
                delete boothData[currentBooth];
                saveData();
                renderBooths();
                updateStats();
                closeModal();
            }
        }

        function updateStats() {
            let total = 0, avail = 0, pend = 0, tak = 0;
            for (let col in layout) {
                layout[col].forEach(boothId => {
                    total++;
                    const data = boothData[boothId] || { status: 'available' };
                    if (data.status === 'available') avail++;
                    else if (data.status === 'pending') pend++;
                    else if (data.status === 'taken') tak++;
                });
            }
            document.getElementById('total').textContent = total;
            document.getElementById('available').textContent = avail;
            document.getElementById('pending').textContent = pend;
            document.getElementById('taken').textContent = tak;
        }

        function resetAll() {
            if (confirm('Reset all booth data?')) {
                boothData = {};
                saveData();
                renderBooths();
                updateStats();
            }
        }

        function exportData() {
            let csv = 'Booth,Status,Organization,Contact,Email,Notes\n';
            for (let col in layout) {
                layout[col].forEach(boothId => {
                    const data = boothData[boothId] || { status: 'available', organization: '', contact: '', email: '', notes: '' };
                    csv += `"${boothId}","${data.status}","${data.organization}","${data.contact}","${data.email}","${data.notes}"\n`;
                });
            }
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'booth-map.csv';
            a.click();
        }

        function saveData() {
            localStorage.setItem('boothData', JSON.stringify(boothData));
        }

        function loadData() {
            const saved = localStorage.getItem('boothData');
            if (saved) boothData = JSON.parse(saved);
        }

        document.getElementById('modal').onclick = function(e) {
            if (e.target === this) closeModal();
        };

        init();
    </script>
</body>
</html>
