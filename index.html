<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 HCBS Conference - Home</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #006273 0%, #3a8297 50%, #58b0e2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 60px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            text-align: center;
        }
        h1 {
            color: #006273;
            margin-bottom: 20px;
            font-size: 32px;
        }
        p {
            color: #666;
            margin-bottom: 40px;
            font-size: 18px;
        }
        .button {
            display: inline-block;
            background: #006273;
            color: white;
            padding: 20px 40px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 20px;
            font-weight: 600;
            margin: 10px;
            transition: all 0.3s;
        }
        .button:hover {
            background: #004d5a;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 98, 115, 0.3);
        }
        .button.secondary {
            background: #58b0e2;
        }
        .button.secondary:hover {
            background: #3a8297;
        }
        .status {
            margin-top: 40px;
            padding: 20px;
            background: #d4edda;
            border: 2px solid #28a745;
            border-radius: 10px;
            color: #155724;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎪 2026 HCBS Conference</h1>
        <p>Welcome to the booth selection system</p>

        <a href="booth-selector.html" class="button">
            🗺️ Open Booth Selector
        </a>

        <br>

        <a href="diagnostic.html" class="button secondary">
            🔍 Run Diagnostics
        </a>

        <a href="monday-calendar.html" class="button secondary">
            📅 Activity Calendar
        </a>

        <div class="status">
            <strong>✓ Server is Running!</strong><br>
            You're viewing this page successfully
        </div>
    </div>
</body>
</html>
