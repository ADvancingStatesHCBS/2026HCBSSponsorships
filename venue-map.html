<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HCBS Venue Map - Clickable Booth Selection</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #006273 0%, #3a8297 50%, #58b0e2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 1600px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 32px;
            color: #006273;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 16px;
            color: #666;
        }

        .legend {
            display: flex;
            gap: 30px;
            justify-content: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: #333;
        }

        .legend-color {
            width: 30px;
            height: 30px;
            border-radius: 4px;
            border: 2px solid #333;
        }

        .selected-booth {
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            text-align: center;
            min-height: 80px;
        }

        .selected-booth h3 {
            color: #006273;
            margin-bottom: 10px;
        }

        .selected-booth p {
            color: #666;
            font-size: 14px;
        }

        .map-container {
            display: flex;
            justify-content: center;
            margin-top: 20px;
            overflow-x: auto;
        }

        svg {
            max-width: 100%;
            height: auto;
        }

        .booth {
            cursor: pointer;
            transition: all 0.2s;
            stroke: #333;
            stroke-width: 2;
        }

        .booth:hover {
            stroke: #ffd700;
            stroke-width: 4;
            filter: brightness(1.1);
        }

        .booth.selected {
            stroke: #ff0000;
            stroke-width: 4;
        }

        .booth-number {
            font-size: 12px;
            font-weight: bold;
            fill: white;
            text-anchor: middle;
            pointer-events: none;
            user-select: none;
        }

        .dance-stage {
            fill: #4a4a4a;
            stroke: #333;
            stroke-width: 3;
        }

        .stage-label {
            font-size: 16px;
            font-weight: bold;
            fill: #333;
            text-anchor: middle;
            pointer-events: none;
        }

        .exit {
            fill: #dc3545;
            stroke: #333;
            stroke-width: 2;
        }

        .dimension-label {
            font-size: 10px;
            fill: #666;
            text-anchor: middle;
            pointer-events: none;
        }

        /* Color classes for booths */
        .booth-blue {
            fill: #58b0e2;
        }

        .booth-purple {
            fill: #7b68a6;
        }

        .booth-orange {
            fill: #ff8c42;
        }

        .booth-green {
            fill: #5a9367;
        }

        .booth-lightblue {
            fill: #7eb8bb;
        }

        .booth-gold {
            fill: #daa520;
        }
    </style>
</head>

    <script>
        // Store selected booth
        let selectedBooth = null;

        // Add click event listeners to all booths
        document.querySelectorAll('.booth').forEach(booth => {
            booth.addEventListener('click', function() {
                const boothNumber = this.getAttribute('data-booth');
                const tier = this.getAttribute('data-tier');
                const size = this.getAttribute('data-size');

                // Remove previous selection
                if (selectedBooth) {
                    selectedBooth.classList.remove('selected');
                }

                // Add selection to clicked booth
                this.classList.add('selected');
                selectedBooth = this;

                // Update selected booth display
                const selectedBoothDiv = document.getElementById('selectedBooth');

                let tierText = '';
                switch(tier) {
                    case 'all':
                        tierText = 'Available to All Tiers';
                        break;
                    case 'exhibitor':
                        tierText = 'Exhibitor Only';
                        break;
                    case 'all-gold':
                        tierText = 'Available to All (Likely Gold)';
                        break;
                }

                selectedBoothDiv.innerHTML = `
                    <h3>Booth ${boothNumber}</h3>
                    <p><strong>Size:</strong> ${size}' booth | <strong>Tier:</strong> ${tierText}</p>
                    <p style="margin-top: 10px; color: #999; font-size: 12px;">
                        Add your custom logic here - e.g., assignment, availability check, sponsor selection, etc.

        });
