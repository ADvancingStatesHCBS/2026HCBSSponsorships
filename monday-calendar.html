        .config-field label {

            font-weight: 500;
            margin-bottom: 5px;
            color: #333;
            font-size: 12px;
        }

        .config-field input {
            width: 100%;
            padding: 8px;
            border: 2px solid #ddd;
            border-radius: 4px;
            font-size: 13px;
        }

        .filter-section {
            padding: 15px 30px;
            background: #f8f9fa;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
        }

        .filter-checkbox {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }

        .filter-checkbox input[type="checkbox"] {

            height: 16px;
            cursor: pointer;
        }

        .filter-checkbox span {

            color: #555;

            background: white;

            width: 1400px;
            height: 900px;
            margin: 0 auto;
            background: #fafafa;
            border: 2px solid #ccc;
        }

        .booth {
            position: absolute;
            border: 2px solid #333;
            background: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;

            font-size: 14px;

        .booth:hover {

        }

        .booth.available {

        function loadConfig() {
            const saved = localStorage.getItem('mondayConfig');
            if (saved) {
                config = { ...config, ...JSON.parse(saved) };
                document.getElementById('apiToken').value = config.apiToken || '';
                document.getElementById('boardId').value = config.boardId || '';
                document.getElementById('boothColumn').value = config.boothColumn || 'text';
                document.getElementById('statusColumn').value = config.statusColumn || 'status';
                document.getElementById('sponsorshipColumn').value = config.sponsorshipColumn || 'color_mkwgq36e';
            }
        }

        function saveConfig() {
            config.apiToken = document.getElementById('apiToken').value;
            config.boardId = document.getElementById('boardId').value;
            config.boothColumn = document.getElementById('boothColumn').value;
            config.statusColumn = document.getElementById('statusColumn').value;
            config.sponsorshipColumn = document.getElementById('sponsorshipColumn').value;
            localStorage.setItem('mondayConfig', JSON.stringify(config));
        }

        async function loadBoard(silent = false) {
            saveConfig();

            if (!config.apiToken || !config.boardId) {
                alert('Please enter your API Token and Board ID');
                return;
            }

            if (!silent) {
                document.getElementById('floorPlan').innerHTML = '<div class="loading">Loading board data...</div>';
            }

            try {
                let allItems = [];
                let cursor = null;
                let hasMore = true;

                while (hasMore) {
                    const query = `query {
                        boards(ids: ${config.boardId}) {
                            items_page(limit: 500${cursor ? `, cursor: "${cursor}"` : ''}) {
                                cursor
                                items {
                                    id
                                    name
                                    column_values {
                                        id
                                        text
                                        value
                                    }
                                }
                            }
                        }
                    }`;

                    const response = await fetch('https://api.monday.com/v2', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': config.apiToken
                        },
                        body: JSON.stringify({ query })
                    });

                    const data = await response.json();

                    if (data.errors) {
                        throw new Error(data.errors[0].message);
                    }

                    const itemsPage = data.data.boards[0].items_page;
                    allItems = allItems.concat(itemsPage.items);

                    cursor = itemsPage.cursor;
                    hasMore = itemsPage.items.length === 500;
                }

                sponsors = parseSponsors(allItems);
                renderFloorPlan();
            } catch (error) {
                document.getElementById('floorPlan').innerHTML =
                    `<div class="loading">Error loading board: ${error.message}</div>`;
            }
        }

        function parseSponsors(items) {
            return items.map(item => {
                const boothColumn = item.column_values.find(col => col.id === config.boothColumn);
                const statusColumn = item.column_values.find(col => col.id === config.statusColumn);
                const sponsorshipColumn = item.column_values.find(col => col.id === config.sponsorshipColumn);

                let boothNumber = boothColumn?.text || '';

                let sponsorshipLevel = 'Other';
                if (sponsorshipColumn) {
                    if (sponsorshipColumn.value) {
                        try {
                            const parsed = JSON.parse(sponsorshipColumn.value);
                            sponsorshipLevel = parsed.label || parsed.text || sponsorshipColumn.text || 'Other';
                        } catch {
                            sponsorshipLevel = sponsorshipColumn.value || sponsorshipColumn.text || 'Other';
                        }
                    } else if (sponsorshipColumn.text) {
                        sponsorshipLevel = sponsorshipColumn.text;
                    }
                }

                let status = 'available';
                if (statusColumn?.text) {
                    const statusText = statusColumn.text.toLowerCase();
                    if (statusText.includes('taken') || statusText.includes('assigned')) {
                        status = 'taken';
                    } else if (statusText.includes('pending') || statusText.includes('hold')) {
                        status = 'pending';
                    }
                }

                return {
                    id: item.id,
                    organization: item.name,
                    boothNumber: boothNumber.trim(),
                    sponsorshipLevel: sponsorshipLevel.trim(),
                    status: status
                };
            });
        }

            floorPlan.innerHTML += '<div class="amenity" style="top: 560px; right: 190px; width: 120px; height: 90px; font-size: 16px; line-height: 1.3;"><b>HCBS</b><br>REGISTRATION</div>';

            // Add elevator markers
            floorPlan.innerHTML += '<div class="elevator" style="top: 100px; right: 240px; width: 30px; height: 30px;">ELEV</div>';
            floorPlan.innerHTML += '<div class="elevator" style="top: 100px; right: 200px; width: 30px; height: 30px;">ELEV</div>';
            floorPlan.innerHTML += '<div class="elevator" style="top: 100px; right: 160px; width: 30px; height: 30px;">ELEV</div>';

            // Render booths
            boothLayout.forEach(boothDef => {
                // Skip amenities
                if (boothDef.isAmenity) return;

                const sponsorData = sponsors.find(s => s.boothNumber === boothDef.number);
                const booth = document.createElement('div');
                booth.className = 'booth';

                if (sponsorData) {
                    booth.classList.add(sponsorData.status);

                    // Apply filter
                    const level = sponsorData.sponsorshipLevel;
                    const isFiltered = checkFilter(level);
                    if (!isFiltered) {
                        booth.style.opacity = '0.3';
                    }
                }

                booth.style.left = boothDef.x + 'px';
                booth.style.top = boothDef.y + 'px';
                booth.style.width = boothDef.width + 'px';
                booth.style.height = boothDef.height + 'px';

                const sizeText = boothDef.size ? `<div class="booth-size">${boothDef.size}</div>` : '';
                booth.innerHTML = `
                    <div class="booth-number">${boothDef.number}</div>
                    ${sponsorData ? `<div class="booth-org">${sponsorData.organization}</div>` : ''}
                    ${sizeText}
                `;

                booth.onclick = () => openBoothModal(boothDef.number, sponsorData);
                floorPlan.appendChild(booth);
            });
        }

        function checkFilter(sponsorshipLevel) {
            const filters = {
                'Platinum': document.getElementById('filterPlatinum').checked,
                'Diamond': document.getElementById('filterDiamond').checked,
                'Emerald': document.getElementById('filterEmerald').checked,
                'Sapphire': document.getElementById('filterSapphire').checked,
                'Ruby': document.getElementById('filterRuby').checked,
                'Gold': document.getElementById('filterGold').checked,
                'Other': document.getElementById('filterOther').checked
            };

            return filters[sponsorshipLevel] !== false;
        }

        function applyFilter() {
            renderFloorPlan();
        }

        function openBoothModal(boothNumber, sponsorData) {
            document.getElementById('modalBoothNumber').value = boothNumber;
            document.getElementById('modalOrganization').value = sponsorData?.organization || 'Unassigned';
            document.getElementById('modalSponsorshipLevel').value = sponsorData?.sponsorshipLevel || 'N/A';
            document.getElementById('modalStatus').value = sponsorData?.status || 'Available';
            document.getElementById('boothModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('boothModal').classList.remove('active');
        }

        function refreshData() {
            loadBoard();
        }

        document.getElementById('boothModal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        loadConfig();
    </script>
</body>
</html>
