<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Sponsor Banner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .full-width-section {
            max-width: 100% !important;
            width: 100% !important;
            padding-left: 0 !important;
            padding-right: 0 !important;
            margin-left: 0 !important;
            margin-right: 0 !important;
        }

        .full-width-section > div {
            max-width: 100% !important;
            width: 100% !important;
        }

        .sponsor-banner-wrapper {
            padding: 20px 2%;
            background-color: #d4e4d2;
        }

        .sponsor-banner {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #d4e4d2;
            padding: 25px 0 25px 0;
            overflow: hidden;
            width: 100%;
        }

        .sponsor-label {
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            font-style: italic;
            color: #1a4a5e;
            margin-bottom: 30px;
        }

        .sponsor-hint {
            text-align: center;
            font-size: 14px;
            color: #5a7a6a;
            margin-top: 20px;
        }

        .sponsor-track-container {
            overflow: hidden;
            position: relative;
        }

        .sponsor-track {
            display: flex;
            align-items: center;
            width: max-content;
            animation: scroll 45s linear infinite;
        }

        /* Pause animation on hover */
        .sponsor-track-container:hover .sponsor-track {
            animation-play-state: paused;
        }

        /* Flip Card Styles */
        .sponsor-card {
            flex-shrink: 0;
            width: 300px;
            height: 180px;
            margin: 0 20px;
            perspective: 1000px;
            cursor: pointer;
        }

        .sponsor-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }

        .sponsor-card.flipped .sponsor-card-inner {
            transform: rotateY(180deg);
        }

        .sponsor-card-front,
        .sponsor-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .sponsor-card-front {
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .sponsor-card-front img {
            max-height: 120px;
            max-width: 250px;
            object-fit: contain;
        }

        .sponsor-card-back {
            background: linear-gradient(135deg, #1a4a5e 0%, #2d6a7a 100%);
            transform: rotateY(180deg);
            padding: 15px;
            display: flex;
            flex-direction: column;
            color: white;
            overflow: hidden;
        }

        .sponsor-card-back-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .sponsor-card-back-logo {
            width: 50px;
            height: 50px;
            background-color: white;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .sponsor-card-back-logo img {
            max-width: 40px;
            max-height: 40px;
            object-fit: contain;
        }

        .sponsor-card-back-name {
            font-size: 14px;
            font-weight: 600;
            line-height: 1.2;
        }

        .sponsor-card-back-bio {
            font-size: 11px;
            line-height: 1.4;
            color: rgba(255, 255, 255, 0.9);
            flex-grow: 1;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .sponsor-social-links {
            display: flex;
            gap: 10px;
            justify-content: center;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }

        .social-link {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .social-link:hover {
            background-color: rgba(255, 255, 255, 0.3);
            transform: scale(1.1);
        }

        .social-link svg {
            width: 16px;
            height: 16px;
            fill: white;
        }

        .social-link.disabled {
            opacity: 0.3;
            pointer-events: none;
        }

        @keyframes scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* Responsive Styles */
        @media (max-width: 768px) {
            .sponsor-banner-wrapper { padding: 15px 4%; }
            .sponsor-label { font-size: 22px; margin-bottom: 20px; }

            .sponsor-card {
                width: 220px;
                height: 140px;
                margin: 0 10px;
            }

            .sponsor-card-front img {
                max-height: 80px;
                max-width: 180px;
            }

            .sponsor-card-back {
                padding: 10px;
            }

            .sponsor-card-back-logo {
                width: 35px;
                height: 35px;
            }

            .sponsor-card-back-logo img {
                max-width: 28px;
                max-height: 28px;
            }

            .sponsor-card-back-name {
                font-size: 12px;
            }

            .sponsor-card-back-bio {
                font-size: 9px;
            }

            .social-link {
                width: 26px;
                height: 26px;
            }

            .social-link svg {
                width: 12px;
                height: 12px;
            }
        }
    </style>
</head>

        // Create sponsor cards
        function createSponsorCard(sponsor) {
            const card = document.createElement('div');
            card.className = 'sponsor-card';

            card.innerHTML = `
                <div class="sponsor-card-inner">
                    <div class="sponsor-card-front">
                        <img src="${sponsor.logo}" alt="${sponsor.name}">
                    </div>
                    <div class="sponsor-card-back">
                        <div class="sponsor-card-back-header">
                            <div class="sponsor-card-back-logo">
                                <img src="${sponsor.logo}" alt="${sponsor.name}">
                            </div>
                            <div class="sponsor-card-back-name">${sponsor.name}</div>
                        </div>
                        <div class="sponsor-card-back-bio">${sponsor.bio}</div>
                        <div class="sponsor-social-links">
                            <a href="${sponsor.website}" target="_blank" rel="noopener noreferrer" class="social-link ${!sponsor.website ? 'disabled' : ''}" title="Website" onclick="event.stopPropagation();">
                                ${icons.website}
                            </a>
                            <a href="${sponsor.linkedin}" target="_blank" rel="noopener noreferrer" class="social-link ${!sponsor.linkedin ? 'disabled' : ''}" title="LinkedIn" onclick="event.stopPropagation();">
                                ${icons.linkedin}
                            </a>
                            <a href="${sponsor.facebook}" target="_blank" rel="noopener noreferrer" class="social-link ${!sponsor.facebook ? 'disabled' : ''}" title="Facebook" onclick="event.stopPropagation();">
                                ${icons.facebook}
                            </a>
                            <a href="${sponsor.twitter}" target="_blank" rel="noopener noreferrer" class="social-link ${!sponsor.twitter ? 'disabled' : ''}" title="X (Twitter)" onclick="event.stopPropagation();">
                                ${icons.twitter}
                            </a>
                        </div>
                    </div>
                </div>
            `;

            // Toggle flip on click
            card.addEventListener('click', function(e) {
                // Don't flip if clicking a social link
                if (e.target.closest('.social-link')) return;
                this.classList.toggle('flipped');
            });

            return card;
        }

        // Initialize the sponsor track
        function initSponsorTrack() {
            const track = document.getElementById('sponsorTrack');

            // Add sponsors twice for seamless infinite scroll
            [...sponsors, ...sponsors].forEach(sponsor => {
                track.appendChild(createSponsorCard(sponsor));
            });
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', initSponsorTrack);
